[project]
name = "homeassistant-mcp"
version = "0.1.0"
description = "MCP server providing limited access to Home Assistant (lights only)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
homeassistant-mcp = "homeassistant_mcp.server:main"
homeassistant-mcp-scan = "homeassistant_mcp.scan:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homeassistant_mcp"]